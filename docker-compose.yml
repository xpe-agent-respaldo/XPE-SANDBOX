name: xpe-sandbox
services:
  sandbox:
    image: ghcr.io/agent-infra/sandbox:1.11.0
    container_name: xpe-sandbox
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      SANDBOX_API_KEY: ${XPE_SANDBOX_KEY:?define XPE_SANDBOX_KEY}
    ports:
      - "${XPE_SANDBOX_PORT:-8080}:8080"
    volumes:
      - xpe-data:/home/oai/share
    mem_limit: 10g
    cpus: "3.0"
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8080/v1/sandbox"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  xpe-data:
